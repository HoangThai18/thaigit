# Deploy trang chu len VPS (git.thaipro.store).
#
# Khac `site.yml`: file do day len GitHub Pages, file nay day len VPS cua chu du an.
# Hai cai chay song song duoc, khong dam nhau.
#
# Khoa SSH o phia VPS bi EP LENH: authorized_keys cua user `thaigitdeploy` mo dau bang
# command="sudo /usr/local/bin/deploy-thaigit.sh" nen bat ke `script` duoi day ghi gi,
# sshd cung chi chay dung script deploy. Khoa do neu lo ra ngoai cung khong mo duoc shell.
#
# VPS con mot timer du phong (thaigit-deploy.timer) kiem `main` moi 5 phut, nen workflow
# nay hong thi trang van duoc cap nhat, chi cham hon.
#
# Viet kieu flow (mot dong moi khoa) vi trinh soan thao web cua GitHub tu thut le, go
# kieu thuong se lam lech YAML. Chay `pnpm format` o may de Prettier dan lai cho de doc.
name: Deploy site len VPS
on: { push: { branches: [main], paths: ['site/**', 'packages/**', 'CHANGELOG.md', '.github/workflows/deploy-vps.yml'] }, workflow_dispatch: {} }
concurrency: { group: deploy-vps-thaigit, cancel-in-progress: false }
jobs: { deploy: { runs-on: ubuntu-latest, steps: [ { name: SSH vao VPS va chay deploy, uses: appleboy/ssh-action@v1.2.0, with: { host: '${{ secrets.VPS_HOST }}', username: '${{ secrets.VPS_USER }}', key: '${{ secrets.VPS_SSH_KEY }}', port: '${{ secrets.VPS_PORT }}', script_stop: true, script: deploy } } ] } }
