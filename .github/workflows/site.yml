# Build trang chủ (site/, Next.js xuất tĩnh) và đăng lên GitHub Pages → git.thaipro.store.
# Cài đặt một lần: xem docs/deploy-site.md (bật Pages với nguồn "GitHub Actions", gắn tên miền, DNS).
name: Trang chủ

on:
  push:
    branches: [main]
    paths:
      - site/**
      - CHANGELOG.md
      - pnpm-lock.yaml
      - .nvmrc
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read

# Chỉ một lượt đăng mỗi lúc; lượt mới không huỷ lượt đang đăng dở.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # Không bật cache: job này tạo ra trang được đăng công khai.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Cài phụ thuộc (chỉ trang chủ)
        run: pnpm install --frozen-lockfile --filter @thaigit/site
      - name: Kiểm tra kiểu
        run: pnpm --filter @thaigit/site check
      - name: Build (xuất ra site/out)
        run: pnpm --filter @thaigit/site build
        env:
          # Chỉ dùng lúc build để hỏi bản phát hành mới nhất (tránh giới hạn lượt gọi API ẩn danh); không lọt vào trang.
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/out

  deploy:
    name: Đăng lên GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
