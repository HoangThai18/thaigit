name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  swift:
    name: App Swift (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Chọn Xcode 26 (Swift 6.2)
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - name: Test
        run: swift test

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Cài phụ thuộc
        id: install
        run: pnpm install --frozen-lockfile
      - name: Kiểm tra kiểu (TS + Svelte)
        run: pnpm check
      - name: Lint (ESLint)
        # Chạy cả khi bước kiểm tra trước lỗi: một lượt CI thấy hết lỗi (miễn là đã cài được phụ thuộc).
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint
      - name: Test TS (core, contracts — git thật)
        # Chạy cả khi bước kiểm tra trước lỗi: một lượt CI thấy hết lỗi (miễn là đã cài được phụ thuộc).
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test
      - name: Clippy
        # Chạy cả khi bước kiểm tra trước lỗi: một lượt CI thấy hết lỗi (miễn là đã cài được phụ thuộc).
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Test Rust
        # Chạy cả khi bước kiểm tra trước lỗi: một lượt CI thấy hết lỗi (miễn là đã cài được phụ thuộc).
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: apps/desktop/src-tauri
        run: cargo test
      - name: Build app (debug, không đóng gói)
        id: build
        # Chạy cả khi bước kiểm tra trước lỗi: một lượt CI thấy hết lỗi (miễn là đã cài được phụ thuộc).
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm --filter @thaigit/desktop tauri build --debug --no-bundle
      - name: Kiểm thử khói (mở app thật, chờ giao diện báo sẵn sàng)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/smoke-app.mjs apps/desktop/src-tauri/target/debug/thaigit
